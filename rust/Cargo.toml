[package]
name = "power_rename"
version = "0.1.0"
edition = "2021"
description = "Batch file renaming tool (Rust port of PowerRenamePy)"

[lib]
name = "power_rename"
path = "src/lib.rs"

[[bin]]
name = "power_rename"
path = "src/main.rs"

[dependencies]
regex = "1"
fancy-regex = "0.14"
walkdir = "2"
eframe = "0.31"
rfd = "0.15"

[profile.release]
lto = true
codegen-units = 1
strip = true
opt-level = "s"
panic = "abort"
